---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- with .Values.additionalAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: gcecustommachinetypes.karpenter.k8s.gcp
spec:
  group: karpenter.k8s.gcp
  names:
    categories:
    - karpenter
    kind: GCECustomMachineType
    listKind: GCECustomMachineTypeList
    plural: gcecustommachinetypes
    shortNames:
    - gcecmt
    - gcecmts
    singular: gcecustommachinetype
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.machineType
      name: MachineType
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GCECustomMachineType registers a GCE custom machine type so the instance type provider can
          discover it, price it, and make it available for scheduling like any predefined shape. See
          proposals/0007-custom-machine-type-catalog.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GCECustomMachineTypeSpec registers a GCE custom machine type (e.g. n2-custom-8-24576) so it
              joins the instance type catalog alongside predefined shapes. GCP does not enumerate custom
              shapes through machineTypes.aggregatedList (the API Karpenter otherwise uses to discover
              instance types), so a shape must be registered here before it can be scheduled onto.
            properties:
              machineType:
                description: |-
                  MachineType is the real GCE custom machine type name, e.g. "n2-custom-8-24576". Immutable
                  after creation; create a new object to register a different shape.
                pattern: ^[a-z][a-z0-9]*-custom-[1-9][0-9]*-[1-9][0-9]*(-ext)?$
                type: string
                x-kubernetes-validations:
                - message: machineType is immutable
                  rule: self == oldSelf
              prices:
                description: |-
                  Prices are the hourly prices Karpenter uses for scheduling and consolidation decisions.
                  GCP does not publish prices for custom shapes (unlike predefined ones), so they must be
                  supplied explicitly until the pricing provider can compute them (see proposals/0007).
                properties:
                  onDemand:
                    description: OnDemand is the on-demand hourly price in USD.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  spot:
                    description: Spot is the Spot hourly price in USD.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                required:
                - onDemand
                - spot
                type: object
            required:
            - machineType
            - prices
            type: object
          status:
            description: |-
              GCECustomMachineTypeStatus contains the resolved state of the GCECustomMachineType, as
              discovered from GCE via machineTypes.get (which, unlike machineTypes.aggregatedList,
              supports resolving a specific valid custom shape on demand).
            properties:
              conditions:
                description: Conditions contains signals for health and readiness.
                items:
                  description: Condition aliases the upstream type and adds additional
                    helper methods
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              guestCpus:
                description: GuestCpus is the resolved vCPU count for MachineType.
                format: int32
                type: integer
              memoryMb:
                description: MemoryMb is the resolved memory, in MB, for MachineType.
                format: int32
                type: integer
              zones:
                description: Zones lists the cluster zones where MachineType was confirmed
                  available.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
