{{- if .Values.spotPreemptionNotice.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "karpenter.preemptionNotice.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter.preemptionNotice.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "karpenter.preemptionNotice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karpenter.preemptionNotice.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the detection script or monitor config changes.
        checksum/config: {{ include (print $.Template.BasePath "/npd-preemption-configmap.yaml") . | sha256sum }}
      {{- with .Values.additionalAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "karpenter.preemptionNotice.fullname" . }}
      # Talk to the real GCE metadata server directly. Without this the pod goes
      # through the GKE metadata server, which does not expose instance/preempted.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # A node about to be preempted must not have its own detector evicted first.
      priorityClassName: {{ .Values.spotPreemptionNotice.priorityClassName }}
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        {{- toYaml .Values.spotPreemptionNotice.nodeSelector | nindent 8 }}
      {{- with .Values.spotPreemptionNotice.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Spot nodes carry arbitrary workload taints; the detector has to reach all
      # of them, so it tolerates everything.
      tolerations:
        {{- toYaml .Values.spotPreemptionNotice.tolerations | nindent 8 }}
      containers:
        - name: node-problem-detector
          image: "{{ .Values.spotPreemptionNotice.image.repository }}:{{ .Values.spotPreemptionNotice.image.tag }}"
          imagePullPolicy: {{ .Values.spotPreemptionNotice.image.pullPolicy }}
          command:
            - /node-problem-detector
            - --v=2
            - --logtostderr
            # Only our monitor: the GKE-managed node-problem-detector already
            # covers the kernel and runtime log monitors on Standard node pools.
            - --config.custom-plugin-monitor=/custom-config/gce-preemption-monitor.json
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.spotPreemptionNotice.resources | nindent 12 }}
          volumeMounts:
            - name: custom-config
              mountPath: /custom-config
              readOnly: true
      volumes:
        - name: custom-config
          configMap:
            name: {{ include "karpenter.preemptionNotice.fullname" . }}
            defaultMode: 0555
{{- end -}}
