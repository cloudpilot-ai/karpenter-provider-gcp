{{- if .Values.spotPreemptionNotice.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "karpenter.preemptionNotice.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter.preemptionNotice.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "karpenter.preemptionNotice.fullname" . }}
  labels:
    {{- include "karpenter.preemptionNotice.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # node-problem-detector reads its own node and writes the GCESpotPreempting
  # condition onto it.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "karpenter.preemptionNotice.fullname" . }}
  labels:
    {{- include "karpenter.preemptionNotice.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "karpenter.preemptionNotice.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "karpenter.preemptionNotice.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
