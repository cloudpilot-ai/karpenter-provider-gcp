{{- if .Values.spotPreemptionNotice.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karpenter.preemptionNotice.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter.preemptionNotice.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  gce-preemption-monitor.json: |
    {
      "plugin": "custom",
      "pluginConfig": {
        "invoke_interval": "{{ .Values.spotPreemptionNotice.pollIntervalSeconds }}s",
        "timeout": "{{ add .Values.spotPreemptionNotice.requestTimeoutSeconds 10 }}s",
        "max_output_length": 120,
        "concurrency": 1
      },
      "source": "gce-preemption-monitor",
      "metricsReporting": true,
      "conditions": [
        {
          "type": "GCESpotPreempting",
          "reason": "NoPreemptionNotice",
          "message": "no GCE Spot preemption notice"
        }
      ],
      "rules": [
        {
          "type": "permanent",
          "condition": "GCESpotPreempting",
          "reason": "SpotPreemptionImminent",
          "path": "/custom-config/check-preemption.sh",
          "timeout": "{{ add .Values.spotPreemptionNotice.requestTimeoutSeconds 5 }}s"
        }
      ]
    }
  check-preemption.sh: |
    #!/usr/bin/env bash
    # Reports whether GCE has flagged this Spot VM for preemption, by reading the
    # instance/preempted metadata key. node-problem-detector turns the exit code
    # into the GCESpotPreempting node condition, and Karpenter's interruption
    # controller drains on it.
    #
    # Exit codes are node-problem-detector's:
    #   0  not preempted
    #   1  preempted
    #   2  could not tell
    #
    # Exit 2 matters. A probe that cannot reach the metadata server must not look
    # like a healthy node, or a broken detector would sit reporting False while
    # preemptions went unnoticed.
    #
    # The request is written straight to /dev/tcp rather than shelling out: the
    # node-problem-detector image ships no curl, wget, nc, or python. Anyone
    # overriding image.repository needs a bash with /dev/tcp support. HTTP/1.0
    # with Connection: close makes the server close the socket after the body,
    # so there is no chunked encoding to parse.
    set -uo pipefail

    HOST="${METADATA_HOST:-169.254.169.254}"
    PORT="${METADATA_PORT:-80}"
    REQUEST_PATH="/computeMetadata/v1/instance/preempted"
    TIMEOUT="${REQUEST_TIMEOUT_SECONDS:-{{ .Values.spotPreemptionNotice.requestTimeoutSeconds }}}"

    unknown() {
      echo "$1"
      exit 2
    }

    exec 3<>"/dev/tcp/${HOST}/${PORT}" 2>/dev/null ||
      unknown "cannot reach metadata server at ${HOST}:${PORT}"

    printf 'GET %s HTTP/1.0\r\nHost: metadata.google.internal\r\nMetadata-Flavor: Google\r\nConnection: close\r\n\r\n' \
      "${REQUEST_PATH}" >&3 2>/dev/null || unknown "metadata request failed"

    response=""
    line=""
    read_status=0
    while true; do
      IFS= read -r -t "${TIMEOUT}" line <&3
      read_status=$?
      if [ "${read_status}" -eq 0 ]; then
        response+="${line}"$'\n'
        continue
      fi
      # The body arrives without a trailing newline, so the final read fails at
      # EOF with the payload still sitting in $line. Dropping it would discard
      # the value we came for.
      [ -n "${line}" ] && response+="${line}"$'\n'
      break
    done
    exec 3<&-

    # read returns >128 when it times out and 1 at a clean EOF. A timeout means
    # the server never finished answering, so whatever arrived cannot be trusted.
    if [ "${read_status}" -gt 128 ]; then
      unknown "timed out reading from metadata server after ${TIMEOUT}s"
    fi
    [ -n "${response}" ] || unknown "empty response from metadata server"

    response="${response//$'\r'/}"

    status_line="${response%%$'\n'*}"
    case "${status_line}" in
    HTTP/1.[01]\ 200*) ;;
    *) unknown "unexpected metadata response: ${status_line}" ;;
    esac

    # Body is whatever follows the blank line that ends the headers.
    case "${response}" in
    *$'\n\n'*) body="${response#*$'\n\n'}" ;;
    *) unknown "malformed metadata response: no header terminator" ;;
    esac

    # Trim surrounding whitespace and newlines.
    body="${body#"${body%%[![:space:]]*}"}"
    body="${body%"${body##*[![:space:]]}"}"

    case "${body}" in
    TRUE | true)
      echo "instance is being preempted"
      exit 1
      ;;
    FALSE | false) exit 0 ;;
    *) unknown "unexpected instance/preempted value: '${body}'" ;;
    esac
{{- end -}}
