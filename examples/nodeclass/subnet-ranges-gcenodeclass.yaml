# Direct pod IPs across several secondary IP ranges.
# At launch Karpenter prefers the listed range with the most free IPv4 addresses
# and tries the remaining ranges if one reports IP space exhaustion.
# subnetRangeNames is mutually exclusive with subnetRangeName.
# Use networkConfig.subnetwork for the node subnet.
apiVersion: karpenter.k8s.gcp/v1alpha1
kind: GCENodeClass
metadata:
  name: subnet-ranges-example
spec:
  imageSelectorTerms:
    - family: ContainerOptimizedOS
      channel: cluster
  subnetRangeNames:
    - gke-example-pods
    - gke-example-additional
