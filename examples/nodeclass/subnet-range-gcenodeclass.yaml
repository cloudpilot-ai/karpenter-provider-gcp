# Direct pod IPs to a specific secondary IP range.
# subnetRangeNames controls pod alias IPs; use networkConfig.subnetwork for the node subnet.
apiVersion: karpenter.k8s.gcp/v1alpha1
kind: GCENodeClass
metadata:
  name: subnet-range-example
spec:
  imageSelectorTerms:
    - family: ContainerOptimizedOS
      channel: cluster
  subnetRangeNames:
    - karpenter-pods
