apiVersion: karpenter.k8s.gcp/v1alpha1
kind: GCENodeClass
metadata:
  name: default-ubuntu
spec:
  serviceAccount: "" # fill me
  imageSelectorTerms:
    - family: Ubuntu
      osVersion: "24.04"
      version: v20250106
    # Newest image of the release for the cluster's Kubernetes minor:
    # - family: Ubuntu
    #   osVersion: "24.04"
    #   version: latest
  labels:
    env: dev
  networkTags:
    - karpenter-ubuntu
  disks:
    - sizeGiB: 60
      boot: true
