name: PR metadata

on:
  # Metadata only; never check out or execute pull-request code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [.github/prow.yaml, .github/workflows/pr-metadata.yaml]

permissions:
  contents: read

jobs:
  prow:
    name: Prow commands and labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    concurrency:
      # Keep every comment; newer commands must not replace pending older commands.
      group: prow-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.comment.id || github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: cncf/prow-github-actions@v3.5.0
        with:
          github-token: ${{ github.token }}
          prow-commands: /approve /lgtm /kind /area /label-sync
          # Push/manual runs sync labels; PR updates invalidate the old LGTM.
          jobs: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'label-sync' || 'lgtm' }}

  label:
    name: Size labels
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Ensure size labels exist
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const labels = [
              { name: "size/XS", color: "0e8a16", description: "0-9 lines changed" },
              { name: "size/S", color: "5ebd3e", description: "10-29 lines changed" },
              { name: "size/M", color: "fbca04", description: "30-99 lines changed" },
              { name: "size/L", color: "fe7d37", description: "100-499 lines changed" },
              { name: "size/XL", color: "d93f0b", description: "500-999 lines changed" },
              { name: "size/XXL", color: "b60205", description: "1,000 or more lines changed" },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;

                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ...label,
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

      - name: Determine size label
        id: size
        uses: step-security/action-size@v2.2.0

      - name: Remove stale size labels
        uses: step-security/action-remove-labels@v1.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.size.outputs.stale_labels }}

      - name: Add size label
        uses: step-security/action-add-labels@v1.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.size.outputs.new_label }}

      - name: Label changed paths
        uses: actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler.yaml
          # Preserve areas applied explicitly with /area or through GitHub.
          sync-labels: false
