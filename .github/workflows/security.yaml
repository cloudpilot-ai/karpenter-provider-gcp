name: Security

on:
  pull_request: {}
  push:
    branches: [ "main" ]
  schedule:
    - cron: '45 6 * * *'
    - cron: '30 6 * * 1' # Preserve CodeQL's weekly schedule.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never

  actions-lock:
    name: Actions lockfile
    if: github.event_name != 'schedule' || github.event.schedule == '45 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

  codeql:
    name: CodeQL (${{ matrix.language == 'go' && 'Go' || 'GitHub Actions' }})
    # Match origin/main's standalone CodeQL triggers, not Security's broader ones.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1')
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'go'
        name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - if: matrix.build-mode == 'autobuild'
        name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}

  zizmor:
    name: zizmor (GitHub Actions)
    if: github.event_name != 'schedule' || github.event.schedule == '45 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZIZMOR_VERSION: "1.32.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - name: Generate zizmor SARIF
        id: report
        run: uvx "zizmor@${ZIZMOR_VERSION}" --offline --strict-collection --format sarif . > zizmor.sarif
      # SARIF mode reports findings without failing; preserve the native PR gate.
      - name: Fail on high-severity workflow findings
        if: github.event_name == 'pull_request' && steps.report.outcome == 'success'
        run: uvx "zizmor@${ZIZMOR_VERSION}" --offline --strict-collection --min-severity high .
      - name: Retain zizmor findings
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          if-no-files-found: error

  govulncheck:
    name: govulncheck (Go)
    if: github.event_name != 'schedule' || github.event.schedule == '45 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Report Go vulnerabilities
        id: report
        run: make vulncheck VULNCHECK_FLAGS='-format sarif' > govulncheck.sarif
      # SARIF output exits zero even on findings; text mode supplies the real gate.
      - name: Fail on reachable Go vulnerabilities
        if: steps.report.outcome == 'success'
        run: make vulncheck
      - name: Retain Go findings
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: govulncheck-sarif
          path: govulncheck.sarif
          if-no-files-found: error

  container-image:
    name: Grype (linux/${{ matrix.arch }})
    if: github.event_name != 'schedule' || github.event.schedule == '45 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      PLATFORM: linux/${{ matrix.arch }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install image builder
        run: cd hack/tools && go install github.com/google/ko
      - name: Build local controller image
        env:
          # ko requires a repository even with --push=false.
          KO_DOCKER_REPO: example.invalid/karpenter
        run: |
          mkdir reports
          printf 'commit: %s\nplatform: %s\ncompiler: %s\n' \
            "$GITHUB_SHA" "$PLATFORM" "$(go env GOVERSION)" > reports/build.txt
          grep '^defaultBaseImage:' .ko.yaml >> reports/build.txt
          ko build --bare --push=false --platform "$PLATFORM" --tarball "$RUNNER_TEMP/controller.tar" \
            ./cmd/controller > reports/image.txt
      - name: Install image scanner
        id: grype
        uses: anchore/scan-action/download-grype@v7.4.2
        with:
          grype-version: v0.118.0
          cache-db: false
      - name: Scan OS and Go dependencies
        id: scan
        # A stable input path keeps SARIF locations consistent across runs.
        working-directory: ${{ runner.temp }}
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          "$GRYPE" docker-archive:controller.tar \
            --output "json=$GITHUB_WORKSPACE/reports/grype.json" \
            --output "sarif=$GITHUB_WORKSPACE/reports/grype.sarif"
      # govulncheck gates reachable Go vulnerabilities; retain all image findings above.
      - name: Fail on fixable high or critical OS vulnerabilities
        if: steps.scan.outcome == 'success'
        run: |
          jq '[.matches[] |
            select(.artifact.type | IN("deb", "rpm", "apk", "alpm", "portage")) |
            select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical") |
            select(.vulnerability.fix.state == "fixed") |
            select(any(.vulnerability.fix.versions[]?; type == "string" and length > 0))]' \
            reports/grype.json > reports/blocking-vulnerabilities.json
          jq -e 'length == 0' reports/blocking-vulnerabilities.json
      - name: Retain image inventory and findings
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-security-linux-${{ matrix.arch }}
          path: reports/
          if-no-files-found: error

  # Publish native reports without granting scanners code-scanning write access.
  sarif-report:
    name: Publish SARIF
    needs: [zizmor, govulncheck, container-image]
    if: >-
      !cancelled() && github.repository == 'cloudpilot-ai/karpenter-provider-gcp' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'schedule' || github.event.schedule == '45 6 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download scanner reports
        uses: actions/download-artifact@v8.0.2
        with:
          path: reports
      - name: Upload zizmor findings
        if: ${{ !cancelled() && hashFiles('reports/zizmor-sarif/zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: reports/zizmor-sarif/zizmor.sarif
          category: zizmor
      - name: Upload govulncheck findings
        if: ${{ !cancelled() && hashFiles('reports/govulncheck-sarif/govulncheck.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: reports/govulncheck-sarif/govulncheck.sarif
          category: govulncheck/controller-linux-amd64
      - name: Upload Grype findings (amd64)
        if: ${{ !cancelled() && hashFiles('reports/image-security-linux-amd64/grype.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: reports/image-security-linux-amd64/grype.sarif
          category: grype/main-controller-linux-amd64
      - name: Upload Grype findings (arm64)
        if: ${{ !cancelled() && hashFiles('reports/image-security-linux-arm64/grype.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: reports/image-security-linux-arm64/grype.sarif
          category: grype/main-controller-linux-arm64
