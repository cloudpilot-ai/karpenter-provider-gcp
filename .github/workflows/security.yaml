name: Security checks

on:
  pull_request: {}
  push:
    branches: [ "main" ]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never

  actions-lock:
    name: Verify action dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'go'
        name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - if: matrix.build-mode == 'autobuild'
        name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}

  zizmor:
    name: Workflow security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Fail on high-severity workflow findings
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: v1.32.0
          online-audits: false
          advanced-security: false
          min-severity: high

  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Report Go vulnerabilities
        id: report
        run: make vulncheck VULNCHECK_FLAGS='-format sarif' > govulncheck.sarif
      # SARIF output exits zero even on findings; text mode supplies the real gate.
      - name: Fail on reachable Go vulnerabilities
        if: steps.report.outcome == 'success'
        run: make vulncheck
      - name: Retain Go findings
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: govulncheck-sarif
          path: govulncheck.sarif
          if-no-files-found: error

  container-image:
    name: Image security (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      PLATFORM: linux/${{ matrix.arch }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install image builder
        run: cd hack/tools && go install github.com/google/ko
      - name: Build local controller image
        env:
          # ko requires a repository even with --push=false.
          KO_DOCKER_REPO: example.invalid/karpenter
        run: |
          mkdir reports
          printf 'commit: %s\nplatform: %s\ncompiler: %s\n' \
            "$GITHUB_SHA" "$PLATFORM" "$(go env GOVERSION)" > reports/build.txt
          grep '^defaultBaseImage:' .ko.yaml >> reports/build.txt
          ko build --bare --push=false --platform "$PLATFORM" --tarball "$RUNNER_TEMP/controller.tar" \
            ./cmd/controller > reports/image.txt
      - name: Install image scanner
        id: grype
        uses: anchore/scan-action/download-grype@v7.4.2
        with:
          grype-version: v0.118.0
          cache-db: false
      - name: Scan OS and Go dependencies
        id: scan
        # A stable input path keeps SARIF locations consistent across runs.
        working-directory: ${{ runner.temp }}
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          "$GRYPE" docker-archive:controller.tar \
            --output "json=$GITHUB_WORKSPACE/reports/grype.json" \
            --output "sarif=$GITHUB_WORKSPACE/reports/grype.sarif"
      # govulncheck gates reachable Go vulnerabilities; retain all image findings above.
      - name: Fail on fixable high or critical OS vulnerabilities
        if: steps.scan.outcome == 'success'
        run: |
          jq '[.matches[] |
            select(.artifact.type | IN("deb", "rpm", "apk", "alpm", "portage")) |
            select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical") |
            select(.vulnerability.fix.state == "fixed") |
            select(any(.vulnerability.fix.versions[]?; type == "string" and length > 0))]' \
            reports/grype.json > reports/blocking-vulnerabilities.json
          jq -e 'length == 0' reports/blocking-vulnerabilities.json
      - name: Retain image inventory and findings
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-security-linux-${{ matrix.arch }}
          path: reports/
          if-no-files-found: error

  # Keep write permissions out of the Go and image scanning jobs, including PRs.
  sarif-report:
    name: Publish security findings (${{ matrix.tool }})
    needs: [govulncheck, container-image]
    if: ${{ !cancelled() && github.repository == 'cloudpilot-ai/karpenter-provider-gcp' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: govulncheck
            artifact: govulncheck-sarif
            file: govulncheck.sarif
            category: govulncheck/controller-linux-amd64
          - tool: grype-amd64
            artifact: image-security-linux-amd64
            file: grype.sarif
            category: grype/main-controller-linux-amd64
          - tool: grype-arm64
            artifact: image-security-linux-arm64
            file: grype.sarif
            category: grype/main-controller-linux-arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download security report
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: reports
      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: reports/${{ matrix.file }}
          category: ${{ matrix.category }}

  zizmor-report:
    name: Report workflow security
    if: github.event_name != 'pull_request' && github.repository == 'cloudpilot-ai/karpenter-provider-gcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Analyze workflows and upload SARIF
        id: zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: v1.32.0
          online-audits: false
          advanced-security: true
      - name: Retain SARIF report
        if: ${{ !cancelled() && steps.zizmor.outputs.output-file != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: zizmor-sarif
          path: ${{ steps.zizmor.outputs.output-file }}
          if-no-files-found: error
