name: Release image build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
jobs:
  image-publish:
    if: github.repository == 'cloudpilot-ai/karpenter-provider-gcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Set tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_ENV
          echo "tag_semver=${TAG#v}" >> $GITHUB_ENV
        shell: bash

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Config env
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_AK }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SK }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-2" >> $GITHUB_ENV

      - name: AWS CLI Init
        uses: unfor19/install-aws-cli-action@f5b46b7f32cf5e7ebd652656c5036bf83dd1e60c # v1.0.8

      - name: Config ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/cloudpilotai

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Build, publish, and sign image
        id: image
        env:
          IMAGE_TAG: ${{ env.tag }}
        run: |
          export KO_DOCKER_REPO=public.ecr.aws/cloudpilotai/gcp/karpenter
          IMAGE=$(ko build --bare github.com/cloudpilot-ai/karpenter-provider-gcp/cmd/controller \
            --tags "$IMAGE_TAG" --sbom=spdx --sbom-dir "$RUNNER_TEMP/sboms")
          bash hack/signing/sign-image.sh "$IMAGE"
          printf '%s\n' "$IMAGE" > "$RUNNER_TEMP/sboms/image-reference.txt"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: public.ecr.aws/cloudpilotai/gcp/karpenter
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: false

      - name: Retain SPDX SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-sboms
          path: ${{ runner.temp }}/sboms/
          if-no-files-found: error

  package-chart:
    if: github.repository == 'cloudpilot-ai/karpenter-provider-gcp'
    runs-on: ubuntu-latest
    concurrency:
      group: chart-pages-publish
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_ENV
          echo "tag_semver=${TAG#v}" >> $GITHUB_ENV
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0

      - name: Fetch existing Pages index
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          # Fail on any error except 404 (first-ever deployment has no index yet)
          HTTP_CODE=$(curl -sSL -o /tmp/merge-index.yaml -w "%{http_code}" "${PAGES_URL}/index.yaml")
          if [ "${HTTP_CODE}" = "404" ]; then
            rm -f /tmp/merge-index.yaml
            echo "No existing index (first deployment)."
          elif [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: Failed to fetch Pages index — HTTP ${HTTP_CODE}. Aborting to avoid losing old chart versions."
            exit 1
          fi

      - name: Build chart dependencies
        run: |
          # charts/ is not committed; helm package fails without the pinned subchart archives
          helm dependency build charts/karpenter

      - name: Package and sign charts
        env:
          HELM_SIGNING_KEY_BASE64: ${{ secrets.HELM_SIGNING_KEY_BASE64 }}
          HELM_SIGNING_KEY_PASSPHRASE: ${{ secrets.HELM_SIGNING_KEY_PASSPHRASE }}
          HELM_SIGNING_KEY_FINGERPRINT: ${{ vars.HELM_SIGNING_KEY_FINGERPRINT }}
        run: bash hack/signing/package-charts.sh "$tag_semver" "$tag" charts/

      - name: Attest chart build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: charts/*.tgz

      - name: Update Helm repo index
        run: |
          # Old .tgz files are intentionally absent here: --merge only preserves 'created'
          # timestamps for versions NOT found on disk. Running index before restoring old
          # archives ensures historical timestamps are copied from the Pages index as-is.
          if [ -f /tmp/merge-index.yaml ]; then
            helm repo index charts/ --merge /tmp/merge-index.yaml
          else
            helm repo index charts/
          fi

      - name: Restore previously published chart versions
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          [ ! -f /tmp/merge-index.yaml ] && exit 0

          helm repo add karpenter-gcp "${PAGES_URL}" --force-update

          for CHART in karpenter karpenter-crd; do
            VERSIONS=$(helm search repo "karpenter-gcp/${CHART}" --versions --devel -o json 2>/dev/null | jq -r '.[].version' || true)
            [ -z "${VERSIONS}" ] && continue

            echo "${VERSIONS}" | while read VERSION; do
              if [ ! -f "charts/${CHART}-${VERSION}.tgz" ]; then
                echo "Pulling ${CHART} ${VERSION}..."
                helm pull "karpenter-gcp/${CHART}" --version "${VERSION}" --devel --destination charts/ || \
                  echo "WARNING: could not pull ${CHART} ${VERSION}, skipping"
              fi
            done

            # Fail rather than deploy an incomplete repo
            ACTUAL=0
            for V in ${VERSIONS}; do
              [ -f "charts/${CHART}-${V}.tgz" ] && ACTUAL=$((ACTUAL + 1))
            done
            EXPECTED=$(echo "${VERSIONS}" | grep -c .)
            if [ "${ACTUAL}" -lt "${EXPECTED}" ]; then
              echo "ERROR: Expected ${EXPECTED} ${CHART} archives but only have ${ACTUAL}. Aborting."
              exit 1
            fi
          done

      - name: Restore historical signatures and public keys
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 hack/signing/restore-provenance.py "$PAGES_URL" charts/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: charts/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
