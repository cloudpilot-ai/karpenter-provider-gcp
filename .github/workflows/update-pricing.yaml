# Pricing data codegen workflow.
#
# Mirrors the approach used by karpenter-provider-aws (.github/workflows/codegen.yaml):
# a scheduled job regenerates embedded pricing data from the cloud provider's
# billing API, commits to a dedicated branch, and opens a PR for review.
#
# Reference: https://github.com/aws/karpenter-provider-aws/blob/main/.github/workflows/codegen.yaml
#
# Required repository configuration:
#   Secret  GCP_PRICING_SA_KEY     — service account key JSON
#   Variable GCP_PRICING_PROJECT   — GCP project ID
#
# A free-tier GCP project is sufficient. Required API services setup:
#   gcloud services enable cloudbilling.googleapis.com compute.googleapis.com
#
# The service account only needs:
#   roles/compute.viewer  — read machine type specs and region list (#218)
name: Update pricing data

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate prices without opening a PR (skips the Create PR step)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_PRICING_SA_KEY }}

      - name: Set GCP project
        env:
          PRICING_PROJECT: ${{ vars.GCP_PRICING_PROJECT }}
        run: echo "GOOGLE_CLOUD_PROJECT=$PRICING_PROJECT" >> "$GITHUB_ENV"

      - name: Update initial-prices.json
        run: make update-pricing

      - name: Create PR if pricing changed
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          draft: true
          add-paths: pkg/providers/pricing/initial-prices.json
          commit-message: "chore(pricing): update initial-prices.json"
          title: "chore(pricing): scheduled pricing data refresh"
          body: |
            #### What type of PR is this?
            /kind cleanup

            #### What this PR does / why we need it:
            Refresh generated GCP pricing data in `pkg/providers/pricing/initial-prices.json`.

            #### Related proposal (if applicable):
            N/A

            #### Which issue(s) this PR fixes:
            N/A

            #### Docs and examples
            - [x] `docs/` and `examples/` updated (or this PR does not affect user-facing behaviour, configuration, or APIs)
            - [x] `MIGRATION.md` updated (or this PR does not require any migration steps)

            #### Special notes for your reviewer:
            Automated pricing refresh; review the generated data before merging.
          branch: automated/update-pricing
          signoff: true
          sign-commits: true
          delete-branch: true
          labels: pricing,automated
