name: Development image

on:
  push:
    branches: [ "main" ]

jobs:
  latest-image-build-publish:
    name: Publish image
    if: github.repository == 'cloudpilot-ai/karpenter-provider-gcp' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Select Go toolchain
        id: go-toolchain
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: cloudx-io/setup-go@main
        with:
          go-version: ${{ steps.go-toolchain.outputs.go-version }}
          cache-key-prefix: image-publish
          cache-dependency-path: '**/go.*'
          save: ${{ github.repository == 'cloudpilot-ai/karpenter-provider-gcp' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Config env
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_AK }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SK }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-2" >> $GITHUB_ENV

      - name: AWS CLI Init
        uses: unfor19/install-aws-cli-action@1.0.8

      - name: Config ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/cloudpilotai

      - uses: ko-build/setup-ko@v0.10

      - name: Build and publish image
        id: image
        uses: $/.github/actions/build-controller-image
        with:
          tag: latest
          sbom-artifact-name: development-image-sboms

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: public.ecr.aws/cloudpilotai/gcp/karpenter
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: false
