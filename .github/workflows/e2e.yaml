name: Manual PR E2E

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Upstream PR number (captured head; reruns are rejected)
        required: true
        type: string
      preset:
        description: Authorized cost/selection (each preset needs separate activation)
        required: true
        type: choice
        options: [standard, gpu, full]
        default: standard

permissions: {}

jobs:
  gate:
    if: github.repository == 'cloudpilot-ai/karpenter-provider-gcp' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      source: ${{ steps.capture.outputs.source }}
      config: ${{ steps.capture.outputs.config }}
      sha: ${{ steps.capture.outputs.sha }}
      pr: ${{ steps.capture.outputs.pr }}
      preset: ${{ steps.capture.outputs.preset }}
      target: ${{ steps.capture.outputs.target }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version-file: trusted/go.mod
          cache: false
      - name: Build trusted gate and target validator
        working-directory: trusted
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-bin"
          go build -o "$RUNNER_TEMP/trusted-bin/e2e-ci" ./hack/e2e-ci/cmd/e2e-ci
          go build -o "$RUNNER_TEMP/trusted-bin/e2e-runner" ./hack/e2e-runner
      - name: Authorize and capture immutable invocation/configuration
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          PRESET: ${{ inputs.preset }}
          E2E_CI_ENABLED: ${{ vars.E2E_CI_ENABLED }}
          E2E_ENABLED_PRESETS: ${{ vars.E2E_ENABLED_PRESETS }}
          E2E_TARGET_CONFIG: ${{ vars.E2E_TARGET_CONFIG }}
          E2E_WIF_PROVIDER: ${{ vars.E2E_WIF_PROVIDER }}
          E2E_WIF_AUDIENCE: ${{ vars.E2E_WIF_AUDIENCE }}
          E2E_RUNTIME_SERVICE_ACCOUNT: ${{ vars.E2E_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trusted-bin/e2e-ci" config --preset "$PRESET" > "$RUNNER_TEMP/config.json"
          while IFS='=' read -r key value; do export "$key=$value"; done < <(jq -r '.target | to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/config.json")
          "$RUNNER_TEMP/trusted-bin/e2e-runner" validate-target
          "$RUNNER_TEMP/trusted-bin/e2e-ci" gate --pr "$PR_NUMBER" --preset "$PRESET" --enabled-presets "$E2E_ENABLED_PRESETS" > "$RUNNER_TEMP/gate.json"
          {
            printf 'source=%s\n' "$(jq -c . "$RUNNER_TEMP/gate.json")"
            printf 'config=%s\n' "$(jq -c . "$RUNNER_TEMP/config.json")"
            printf 'sha=%s\n' "$(jq -r .head_sha "$RUNNER_TEMP/gate.json")"
            printf 'pr=%s\n' "$(jq -r .pr_number "$RUNNER_TEMP/gate.json")"
            printf 'preset=%s\n' "$PRESET"
            printf 'target=e2e-%s-%s-%s\n' "$E2E_PROJECT_ID" "$E2E_LOCATION" "$E2E_CLUSTER_NAME"
          } >> "$GITHUB_OUTPUT"
          {
            printf '### Frozen e2e authorization\n\n'
            jq -r '"PR #\(.pr_number) · preset `\(.dispatch.preset)` · actor `\(.dispatch.actor)` (\(.dispatch.actor_id))\n\nHead `\(.head_sha)` from `\(.head_repository)` (\(.head_repository_id))\n\nTrusted `\(.dispatch.workflow_sha)` · invocation \(.dispatch.run_id)/\(.dispatch.run_attempt)"' "$RUNNER_TEMP/gate.json"
            printf '\nGlobal workers: **20**. Dispatch authorizes this captured SHA only.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  pending:
    name: Pending check / ${{ needs.gate.outputs.sha }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    outputs:
      check: ${{ steps.pending.outputs.check }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version-file: trusted/go.mod
          cache: false
      - name: Create exact frozen-SHA check before build/cloud
        id: pending
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_SOURCE: ${{ needs.gate.outputs.source }}
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/e2e-ci" ./hack/e2e-ci/cmd/e2e-ci
          printf '%s\n' "$FROZEN_SOURCE" > "$RUNNER_TEMP/gate.json"
          "$RUNNER_TEMP/e2e-ci" pending --gate "$RUNNER_TEMP/gate.json" > "$RUNNER_TEMP/pending.json"
          printf 'check=%s\n' "$(jq -r .id "$RUNNER_TEMP/pending.json")" >> "$GITHUB_OUTPUT"

  build:
    name: Credential-free build / ${{ needs.gate.outputs.sha }}
    needs: [gate, pending]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact-id }}
      digest: ${{ format('sha256:{0}', steps.bundle.outputs.artifact-digest) }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version-file: trusted/go.mod
          cache: false
      - uses: Azure/setup-helm@5dad9f39cb30e36bd9f8a5c7259a51353cc89871
        with:
          version: v3.19.0
      - name: Build trusted preparation tool (before PR data)
        working-directory: trusted
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-bin"
          go build -o "$RUNNER_TEMP/trusted-bin/e2e-ci" ./hack/e2e-ci/cmd/e2e-ci
          cd hack/tools
          go build -o "$RUNNER_TEMP/trusted-bin/ko" github.com/google/ko
          echo "$RUNNER_TEMP/trusted-bin" >> "$GITHUB_PATH"
      - name: Fetch only captured upstream PR ref and prepare without credentials
        env:
          FROZEN_SOURCE: ${{ needs.gate.outputs.source }}
        run: |
          set -euo pipefail
          printf '%s\n' "$FROZEN_SOURCE" > "$RUNNER_TEMP/gate.json"
          e2e-ci fetch --gate "$RUNNER_TEMP/gate.json" --destination "$RUNNER_TEMP/pr"
          mkdir "$RUNNER_TEMP/bundle-upload"
          e2e-ci prepare --gate "$RUNNER_TEMP/gate.json" --source "$RUNNER_TEMP/pr" --output "$RUNNER_TEMP/bundle-upload/bundle.tar"
      - name: Upload only the explicit bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-bundle-${{ github.run_id }}-1
          path: ${{ runner.temp }}/bundle-upload/bundle.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  runtime:
    name: Runtime ${{ needs.gate.outputs.preset }} / ${{ needs.gate.outputs.sha }}
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: e2e-runtime
    concurrency:
      group: ${{ needs.gate.outputs.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      artifact: ${{ steps.results.outputs.artifact-id }}
      digest: ${{ format('sha256:{0}', steps.results.outputs.artifact-digest) }}
      upload: ${{ steps.results.outcome }}
      export: ${{ steps.export.outcome }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version-file: trusted/go.mod
          cache: false
      - uses: Azure/setup-helm@5dad9f39cb30e36bd9f8a5c7259a51353cc89871
        with:
          version: v3.19.0
      - name: Build only trusted coordinator and registry tooling before PR data
        working-directory: trusted
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-bin" "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/verified" "$RUNNER_TEMP/e2e-auth"
          chmod 700 "$RUNNER_TEMP/e2e-auth"
          go build -o "$RUNNER_TEMP/trusted-bin/e2e-ci" ./hack/e2e-ci/cmd/e2e-ci
          go build -o "$RUNNER_TEMP/trusted-bin/e2e-runner" ./hack/e2e-runner
          (cd hack/tools && go build -o "$RUNNER_TEMP/trusted-bin/crane" github.com/google/go-containerregistry/cmd/crane)
          echo "$RUNNER_TEMP/trusted-bin" >> "$GITHUB_PATH"
      - name: Recheck authorization and verify exact original ZIP before WIF
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_SOURCE: ${{ needs.gate.outputs.source }}
          FROZEN_CONFIG: ${{ needs.gate.outputs.config }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.digest }}
          CI_ENABLED: ${{ vars.E2E_CI_ENABLED }}
          ENABLED_PRESETS: ${{ vars.E2E_ENABLED_PRESETS }}
        run: |
          set -euo pipefail
          test "$CI_ENABLED" = true
          printf '%s\n' "$FROZEN_SOURCE" > "$RUNNER_TEMP/gate.json"
          printf '%s\n' "$FROZEN_CONFIG" > "$RUNNER_TEMP/config.json"
          pr=$(jq -r .pr_number "$RUNNER_TEMP/gate.json")
          preset=$(jq -r .dispatch.preset "$RUNNER_TEMP/gate.json")
          e2e-ci recheck --gate "$RUNNER_TEMP/gate.json" --pr "$pr" --preset "$preset" --enabled-presets "$ENABLED_PRESETS"
          e2e-ci artifact --gate "$RUNNER_TEMP/gate.json" --id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" > "$RUNNER_TEMP/receipt.json"
          e2e-ci download --id "$ARTIFACT_ID" --output "$RUNNER_TEMP/downloads/bundle.zip"
          e2e-ci verify --gate "$RUNNER_TEMP/gate.json" --receipt "$RUNNER_TEMP/receipt.json" --zip "$RUNNER_TEMP/downloads/bundle.zip" --parent "$RUNNER_TEMP/verified" > /dev/null
          jq -r '.target | to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/config.json" >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do export "$key=$value"; done < <(jq -r '.target | to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/config.json")
          e2e-runner validate-target
      - name: Refreshable dedicated runtime WIF (no fixed access token)
        id: auth
        uses: google-github-actions/auth@12060449e87204eca501a11f2f7f1483024afff0
        with:
          workload_identity_provider: ${{ fromJSON(needs.gate.outputs.config).provider }}
          audience: ${{ fromJSON(needs.gate.outputs.config).audience }}
          service_account: ${{ fromJSON(needs.gate.outputs.config).service_account }}
          project_id: ${{ fromJSON(needs.gate.outputs.config).target.E2E_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: false
      - name: Isolate external-account credentials, gcloud config and kubeconfig
        env:
          AUTH_FILE: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          jq -e '.type == "external_account" and (.credential_source.url | startswith("https://")) and (.credential_source.headers.Authorization | startswith("Bearer ")) and (.credential_source | has("file") | not)' "$AUTH_FILE" > /dev/null
          mv "$AUTH_FILE" "$RUNNER_TEMP/e2e-auth/external-account.json"
          chmod 600 "$RUNNER_TEMP/e2e-auth/external-account.json"
          {
            printf 'GOOGLE_APPLICATION_CREDENTIALS=%s/e2e-auth/external-account.json\n' "$RUNNER_TEMP"
            printf 'CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=%s/e2e-auth/external-account.json\n' "$RUNNER_TEMP"
            printf 'CLOUDSDK_CONFIG=%s/e2e-auth/gcloud\n' "$RUNNER_TEMP"
            printf 'KUBECONFIG=%s/e2e-auth/kubeconfig\n' "$RUNNER_TEMP"
            printf 'USE_GKE_GCLOUD_AUTH_PLUGIN=True\n'
          } >> "$GITHUB_ENV"
      - uses: google-github-actions/setup-gcloud@01af06c41d9aa0790d6fdc8f0b982b768ca4d102
        with:
          version: '>= 416.0.0'
          install_components: gke-gcloud-auth-plugin
      - name: Actually configure gcloud/plugin with refreshable credentials
        run: |
          set -euo pipefail
          gcloud auth login --cred-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet > "$RUNNER_TEMP/e2e-auth/login.log" 2>&1
          gcloud container clusters get-credentials "$E2E_CLUSTER_NAME" --project "$E2E_PROJECT_ID" --location "$E2E_LOCATION" > "$RUNNER_TEMP/e2e-auth/get-credentials.log" 2>&1
      - name: Owned prepared lifecycle (no PR checkout/build/scripts)
        run: |
          e2e-runner prepared --source "$RUNNER_TEMP/gate.json" --receipt "$RUNNER_TEMP/receipt.json" --download "$RUNNER_TEMP/downloads/bundle.zip" --results-dir "$RUNNER_TEMP/private-results" --lock-id "github-$GITHUB_RUN_ID-1" > "$RUNNER_TEMP/private-console.log" 2>&1
      - name: Project public-safe evidence even on failure/cancellation
        id: export
        if: always() && steps.verify.outcome == 'success'
        run: |
          e2e-runner export --source "$RUNNER_TEMP/gate.json" --results-dir "$RUNNER_TEMP/private-results" --output "$RUNNER_TEMP/public-results" > "$RUNNER_TEMP/verdict"
      - name: Upload allowlisted safe evidence only
        id: results
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-results-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/public-results/outcome.json
            ${{ runner.temp }}/public-results/results.json
            ${{ runner.temp }}/public-results/junit.xml
            ${{ runner.temp }}/public-results/suite.log
            ${{ runner.temp }}/public-results/controller.log
          if-no-files-found: error
          retention-days: 30
      - name: Record independent safe-export/upload outcomes
        if: always()
        env:
          EXPORT_STATUS: ${{ steps.export.outcome }}
          UPLOAD_STATUS: ${{ steps.results.outcome }}
        run: |
          printf '### Runtime evidence delivery\n\nSafe export: %s · artifact upload: %s\n\nMissing evidence cannot pass. Raw diagnostics remain private and are never uploaded.\n' "$EXPORT_STATUS" "$UPLOAD_STATUS" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runtime credentials (never artifacts)
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/e2e-auth"

  reporter:
    name: Trusted report ${{ needs.gate.outputs.preset }} / ${{ needs.gate.outputs.sha }}
    needs: [gate, pending, build, runtime]
    if: always() && needs.gate.result == 'success' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: e2e-publication-${{ needs.gate.outputs.pr }}-${{ needs.gate.outputs.preset }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version-file: trusted/go.mod
          cache: false
      - name: Build trusted offline renderer and publisher (no PR/cloud execution)
        working-directory: trusted
        env:
          FROZEN_SOURCE: ${{ needs.gate.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trusted-bin"
          go build -o "$RUNNER_TEMP/trusted-bin/e2e-ci" ./hack/e2e-ci/cmd/e2e-ci
          go build -o "$RUNNER_TEMP/trusted-bin/e2e-runner" ./hack/e2e-runner
          echo "$RUNNER_TEMP/trusted-bin" >> "$GITHUB_PATH"
          printf '%s\n' "$FROZEN_SOURCE" > "$RUNNER_TEMP/gate.json"
      - name: Download exact safe artifact and revalidate/reproject as untrusted data
        id: report
        if: needs.runtime.outputs.artifact != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.runtime.outputs.artifact }}
          ARTIFACT_DIGEST: ${{ needs.runtime.outputs.digest }}
        run: |
          set -euo pipefail
          e2e-ci report-download --gate "$RUNNER_TEMP/gate.json" --id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --output "$RUNNER_TEMP/report.zip" --destination "$RUNNER_TEMP/untrusted-report"
          e2e-runner export --source "$RUNNER_TEMP/gate.json" --results-dir "$RUNNER_TEMP/untrusted-report" --output "$RUNNER_TEMP/rendered" > "$RUNNER_TEMP/conclusion"
          printf 'conclusion=%s\n' "$(cat "$RUNNER_TEMP/conclusion")" >> "$GITHUB_OUTPUT"
      - name: Finalize exact SHA check and bot-only ordered comment (best effort on cancellation)
        id: publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ needs.pending.outputs.check }}
          BUILD_STATUS: ${{ needs.build.result }}
          RUNTIME_STATUS: ${{ needs.runtime.result }}
          UPLOAD_STATUS: ${{ needs.runtime.outputs.upload }}
          REPORT_STATUS: ${{ steps.report.outcome }}
          CONCLUSION: ${{ steps.report.outputs.conclusion }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$REPORT_STATUS" == success ]]; then args+=(--markdown "$RUNNER_TEMP/rendered/report.md"); fi
          e2e-ci publish --gate "$RUNNER_TEMP/gate.json" --id "${CHECK_ID:-0}" --build-status "$BUILD_STATUS" --runtime-status "$RUNTIME_STATUS" --upload-status "$UPLOAD_STATUS" --report-status "$REPORT_STATUS" --conclusion "${CONCLUSION:-failure}" "${args[@]}" > "$RUNNER_TEMP/delivery.json"
      - name: Record independent publication errors in job summary
        if: always()
        env:
          PUBLICATION_STATUS: ${{ steps.publish.outcome }}
        run: |
          printf '### Publication\n\nStep: %s\n\n' "$PUBLICATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/delivery.json" ]]; then cat "$RUNNER_TEMP/delivery.json" >> "$GITHUB_STEP_SUMMARY"; else printf 'Delivery outcome unavailable; reconcile pending checks manually.\n' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain delivery outcome separately from test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-delivery-${{ github.run_id }}-1
          path: ${{ runner.temp }}/delivery.json
          if-no-files-found: error
          retention-days: 30
