name: E2E

on:
  # github/command enforces write/maintain/admin before the dependent job runs.
  # Neither job checks out or executes pull-request code.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  gate:
    name: Comment gate
    permissions:
      pull-requests: write # react to commands on PR comments only
    if: github.event.issue.pull_request && (github.event.comment.body == '/e2e' || startsWith(github.event.comment.body, '/e2e '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      accepted: ${{ steps.command.outputs.continue }}
      sha: ${{ steps.command.outputs.sha }}
    steps:
      - name: Parse /e2e command
        id: command
        uses: github/command@v2.0.3
        with:
          command: /e2e
          allowed_contexts: pull_request
          permissions: write,maintain,admin
          allow_forks: true
          allow_drafts: true
          skip_ci: true
          skip_reviews: true
          skip_completing: true

  e2e:
    name: E2E run
    permissions:
      pull-requests: write # update the sticky PR comment
    needs: gate
    if: needs.gate.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: e2e-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      preset: ${{ steps.run.outputs.preset }}
    steps:
      - name: E2E run
        id: run
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMIT_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          preset="${COMMENT_BODY#/e2e}"
          preset="${preset#${preset%%[![:space:]]*}}"
          if [[ -z "${preset}" ]]; then
            preset="standard"
          fi
          if [[ "$preset" == *$'\n'* || "$preset" == *$'\r'* ]]; then
            echo "E2E selection must be a single line" >&2
            exit 1
          fi
          printf 'preset=%s\n' "$preset" >> "$GITHUB_OUTPUT"

          echo "e2e run is not implemented"
          echo "preset: ${preset}"
          echo "commit: $COMMIT_SHA"

      - name: Update sticky comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          number: ${{ github.event.issue.number }}
          header: e2e-placeholder
          message: |
            e2e run is not implemented.

            Preset: `${{ steps.run.outputs.preset }}`
            Commit: `${{ needs.gate.outputs.sha }}`
