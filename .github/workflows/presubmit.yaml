name: Pre-submit check
'on':
  push:
    branches:
    - main
    - ci-cache-trial/go-cache-20261106
  pull_request: {}
permissions:
  contents: read
  pull-requests: read
jobs:
  dependency-review:
    if: ${{ (github.event_name == 'pull_request') && (github.event_name != 'push' || github.ref != 'refs/heads/ci-cache-trial/go-cache-20261106') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      with:
        fail-on-severity: high
        license-check: false
        comment-summary-in-pr: never
  presubmit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
    - name: Select Go toolchain
      id: go-toolchain
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go CI cache
      id: setup-go
      uses: cloudx-io/setup-go@0bbd76c0381c065220668df9b6694845b937aaa0
      with:
        go-version: ${{ steps.go-toolchain.outputs.go-version }}
        cache-key-prefix: ${{ github.job }}
        cache-dependency-path: '**/go.*'
        save: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci-cache-trial/go-cache-20261106') }}
    - name: Locate trial Go cache paths
      id: trial-cache-paths
      shell: bash
      run: 'printf ''gocache=%s\n'' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

        printf ''gomodcache=%s\n'' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

        '
    - name: Restore warmed trial Go cache
      id: trial-go-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '${{ steps.trial-cache-paths.outputs.gocache }}

          ${{ steps.trial-cache-paths.outputs.gomodcache }}

          '
        key: go-cache-Linux-X64-presubmit-1.27.3-ci-cache-trial/go-cache-20261106-c263673cf447ddbb0cb40d23c6c043338275f301d24b7183c023d55dafba9d12-42251101344
        fail-on-cache-miss: true
    - name: Install toolchain
      run: make toolchain
    - name: Restore lint analysis cache
      id: lint-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/golangci-lint
        key: lint-v2.15.0-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-toolchain.outputs.go-version }}-${{ hashFiles('**/go.*', '**/vendor/modules.txt') }}-${{ hashFiles('.golangci*') }}-${{ github.sha }}
        restore-keys: lint-v2.15.0-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-toolchain.outputs.go-version }}-${{ hashFiles('**/go.*', '**/vendor/modules.txt') }}-${{ hashFiles('.golangci*') }}-
    - name: Lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      env:
        GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
      with:
        skip-cache: true
        version: v2.15.0
        only-new-issues: ${{ github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000' }}
        args: ${{ github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000' && '--new-from-rev=f40e249a930b9351622533ca73859ef13a2bc9d9' || '' }}
    - name: Verify
      run: make ci
    - name: Check reachable Go vulnerabilities
      run: make vulncheck
    - name: Save lint analysis cache
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci-cache-trial/go-cache-20261106') && steps.lint-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/golangci-lint
        key: ${{ steps.lint-cache.outputs.cache-primary-key }}
