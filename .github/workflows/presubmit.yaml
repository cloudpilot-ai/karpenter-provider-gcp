name: Pre-submit check

on:
  push:
    branches: [ "main" ]
  pull_request: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never

  presubmit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Select Go toolchain
        id: go-toolchain
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Temporary until github/gh-actions-lock#275 ships in a release.
      - name: Build action dependency verifier
        env:
          VERIFIER_SHA: 39dd6b04a53288324a194d616f80c70477020131
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/gh-actions-lock-275"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/dm3ch/gh-actions-lock.git
          git -C "$src" fetch -q --depth=1 origin "$VERIFIER_SHA"
          git -C "$src" checkout -q FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$VERIFIER_SHA"
          (cd "$src" && GOTOOLCHAIN=local go build -o "$RUNNER_TEMP/gh-actions-lock" ./cmd/gh-actions-lock)

      - name: Verify action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/gh-actions-lock" --verify'

      - name: Restore Go CI cache
        id: setup-go
        uses: cloudx-io/setup-go@main
        with:
          go-version: "${{ steps.go-toolchain.outputs.go-version }}"
          cache-key-prefix: ${{ github.job }}
          cache-dependency-path: '**/go.*'
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install toolchain
        run: make toolchain

      - name: Restore lint analysis cache
        id: lint-cache
        uses: actions/cache/restore@v4.3.0
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: lint-v2.15.0-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-toolchain.outputs.go-version }}-${{ hashFiles('**/go.*', '**/vendor/modules.txt') }}-${{ hashFiles('.golangci*') }}-${{ github.sha }}
          restore-keys: lint-v2.15.0-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-toolchain.outputs.go-version }}-${{ hashFiles('**/go.*', '**/vendor/modules.txt') }}-${{ hashFiles('.golangci*') }}-

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        with:
          skip-cache: true
          version: v2.15.0
          only-new-issues: true

      - name: Verify
        run: make ci

      - name: Check reachable Go vulnerabilities
        run: make vulncheck

      - name: Save lint analysis cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4.3.0
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}
