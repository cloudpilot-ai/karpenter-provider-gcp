name: Update CI tool versions

sources:
  zizmor:
    kind: githubrelease
    spec:
      owner: zizmorcore
      repository: zizmor
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver
        pattern: '>=1.0.0'
    transformers:
      - trimprefix: 'v'
  uv:
    kind: githubrelease
    spec:
      owner: astral-sh
      repository: uv
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver
        pattern: '>=0.1.0'

# Fail closed if either pin stops looking like a versioned env entry, so a
# renamed or restructured key surfaces here instead of silently never updating.
conditions:
  zizmorVersion:
    kind: file
    disablesourceinput: true
    spec:
      file: .github/workflows/security.yaml
      matchpattern: '(?m)^      ZIZMOR_VERSION: "?[0-9]+\.[0-9]+\.[0-9]+"?$'
  uvVersion:
    kind: file
    disablesourceinput: true
    spec:
      file: .github/workflows/security.yaml
      matchpattern: '(?m)^      UV_VERSION: "?[0-9]+\.[0-9]+\.[0-9]+"?$'

targets:
  zizmor:
    kind: yaml
    sourceid: zizmor
    spec:
      file: .github/workflows/security.yaml
      key: $.jobs.zizmor.env.ZIZMOR_VERSION
  uv:
    kind: yaml
    sourceid: uv
    spec:
      file: .github/workflows/security.yaml
      key: $.jobs.zizmor.env.UV_VERSION
