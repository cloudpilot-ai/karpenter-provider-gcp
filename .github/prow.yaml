labels:
  labels:
    - name: security
      color: d73a4a
      description: Security-related changes
  # Match the existing issue/PR templates.
  kind:
    - api-change
    - bug
    - cleanup
    - deprecation
    - documentation
    - failing-test
    - feature
    - flake
    - regression
    - support
  # File-based rules live in .github/labeler.yaml.
  area:
    - api
    - charts
    - ci
    - controller
    - docs
    - examples
    - pricing

approve:
  # Count the author's approval for files covered by their OWNERS entries.
  require_self_approval: false
  github_review: true

tide:
  # Authors with merge permission merge manually after the required checks pass.
  merge_on_events: false
