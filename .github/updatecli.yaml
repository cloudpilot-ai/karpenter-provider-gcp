name: Update Go, controller base image and CI tool pins

sources:
  zizmor:
    kind: githubrelease
    spec:
      owner: zizmorcore
      repository: zizmor
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver
        pattern: '>=1.0.0'
    transformers:
      - trimprefix: 'v'
  zizmorUv:
    kind: githubrelease
    spec:
      owner: astral-sh
      repository: uv
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver
        pattern: '>=0.1.0'
  currentGo:
    kind: golang/gomod
    spec:
      file: go.mod
  goPatch:
    kind: golang
    dependson:
      - source#currentGo
    spec:
      versionfilter:
        kind: semver
        pattern: '~{{ source "currentGo" }}'
  baseImage:
    kind: dockerdigest
    spec:
      image: cgr.dev/chainguard/static
      tag: latest

# All conditions must pass before any target is updated.
conditions:

  zizmorVersion:
    kind: file
    disablesourceinput: true
    spec:
      file: .github/workflows/security.yaml
      matchpattern: '(?m)^      ZIZMOR_VERSION: "?[0-9]+\.[0-9]+\.[0-9]+"?$'
  uvVersion:
    kind: file
    disablesourceinput: true
    spec:
      file: .github/workflows/security.yaml
      matchpattern: '(?m)^      UV_VERSION: "?[0-9]+\.[0-9]+\.[0-9]+"?$'
  toolsGo:
    kind: golang/gomod
    sourceid: currentGo
    spec:
      file: hack/tools/go.mod
  crdToolsGo:
    kind: golang/gomod
    sourceid: currentGo
    spec:
      file: hack/crd-tools/go.mod
  pdcsiGo:
    kind: golang/gomod
    sourceid: currentGo
    spec:
      file: hack/pdcsi-data/go.mod
  controllerToolchain:
    kind: file
    disablesourceinput: true
    failwhen: true
    spec:
      file: go.mod
      matchpattern: '(?m)^toolchain[ \t]'
  toolsToolchain:
    kind: file
    disablesourceinput: true
    failwhen: true
    spec:
      file: hack/tools/go.mod
      matchpattern: '(?m)^toolchain[ \t]'
  crdToolsToolchain:
    kind: file
    disablesourceinput: true
    failwhen: true
    spec:
      file: hack/crd-tools/go.mod
      matchpattern: '(?m)^toolchain[ \t]'
  pdcsiToolchain:
    kind: file
    disablesourceinput: true
    failwhen: true
    spec:
      file: hack/pdcsi-data/go.mod
      matchpattern: '(?m)^toolchain[ \t]'
  baseRepository:
    kind: file
    disablesourceinput: true
    spec:
      file: .ko.yaml
      matchpattern: '(?m)^defaultBaseImage: cgr\.dev/chainguard/static:latest@sha256:[a-f0-9]{64}$'
  basePlatforms:
    kind: dockerimage
    sourceid: baseImage
    spec:
      image: cgr.dev/chainguard/static
      architectures:
        - linux/amd64
        - linux/arm64

targets:
  controllerGo:
    kind: golang/gomod
    sourceid: goPatch
    spec:
      file: go.mod
  toolsGo:
    kind: golang/gomod
    sourceid: goPatch
    spec:
      file: hack/tools/go.mod
  crdToolsGo:
    kind: golang/gomod
    sourceid: goPatch
    spec:
      file: hack/crd-tools/go.mod
  pdcsiGo:
    kind: golang/gomod
    sourceid: goPatch
    spec:
      file: hack/pdcsi-data/go.mod
  baseImage:
    kind: yaml
    sourceid: baseImage
    transformers:
      - addprefix: 'cgr.dev/chainguard/static:'
    spec:
      file: .ko.yaml
      key: $.defaultBaseImage
  zizmor:
    kind: yaml
    sourceid: zizmor
    spec:
      file: .github/workflows/security.yaml
      key: $.jobs.zizmor.env.ZIZMOR_VERSION
  uv:
    kind: yaml
    sourceid: zizmorUv
    spec:
      file: .github/workflows/security.yaml
      key: $.jobs.zizmor.env.UV_VERSION
